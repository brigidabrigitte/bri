<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brigida Brancale</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#F7F6F2;
    --ink:#14120F;
    --muted:#8D8A82;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  [hidden]{ display:none !important; }

  html,body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Instrument Sans', sans-serif;
    height:100%;
    overflow:hidden;
  }
  a{ color:inherit; text-decoration:none; }

  .page{
    display:flex;
    height:100vh;
    width:100vw;
  }

  .left{
    width:42%;
    position:relative;
    padding:2.4rem 3vw;
  }

  .right{
    width:58%;
    position:relative;
  }

  .frames-wrap{
    position:absolute;
    inset:0;
  }

  .photo-grid{
    position:absolute;
    inset:0;
    padding:2.4rem 3vw;
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    grid-auto-rows:1fr;
    gap:0.8rem;
    overflow-y:auto;
  }
  .photo-grid img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .brand{
    font-size:0.95rem;
    font-weight:500;
    letter-spacing:0.02em;
  }

  .name-block{
    display:flex;
    align-items:flex-start;
    gap:3.5vw;
  }

  nav.main-nav{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:0.55rem;
  }
  nav.main-nav a{
    font-size:0.95rem;
    text-transform:uppercase;
    letter-spacing:0.04em;
    position:relative;
  }
  nav.main-nav a::after{
    content:"";
    position:absolute; left:0; right:0; bottom:-2px;
    height:1px; background:currentColor;
    transform:scaleX(0); transform-origin:left;
    transition:transform .3s ease;
  }
  nav.main-nav a:hover::after{ transform:scaleX(1); }
  nav.main-nav a.active{ color:var(--muted); }

  .project-list{
    margin-top:2.6rem;
  }
  .project-list ul{
    list-style:none;
    display:flex;
    flex-direction:column;
    gap:0.7rem;
  }
  .project-list a{
    font-size:1.4rem;
    text-transform:uppercase;
    letter-spacing:0.02em;
    transition:opacity .25s ease;
  }
  .project-list a:hover{ opacity:0.55; }
  .project-list a.active{ opacity:0.55; }

  .about-link{
    position:absolute;
    left:3vw; bottom:2.4rem;
    font-size:0.95rem;
    text-transform:uppercase;
    letter-spacing:0.04em;
  }

  .email-link{
    position:absolute;
    right:3vw; bottom:2.4rem;
    font-size:0.85rem;
    color:var(--muted);
    z-index:10;
  }
  .email-link:hover{ color:var(--ink); }

  .frame{
    position:absolute;
    overflow:visible; /* FIX 6: non tagliamo più le foto, quindi non serve più nascondere ciò che esce */
  }
  .frame img{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%, -50%);
    max-width:100%;
    max-height:100%;
    width:auto;
    height:auto;
    object-fit:contain; /* FIX 6: era "cover" (ritagliava per riempire) — ora la foto resta intera con la sua proporzione */
    box-shadow:0 12px 30px rgba(0,0,0,0.10);
    opacity:0;
    transition:opacity 0.9s ease;
  }
  .frame img.active{ opacity:1; }

  #frame-home{
    top:10%;
    left:50%;
    width:56%;
    height:80%;
    transform:translateX(-50%);
    z-index:1;
  }

  .book{
    position:absolute;
    inset:0;
    padding:2.4rem 3vw;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:1.2rem;
  }
  .book-stage{
    position:relative;
    width:100%;
    max-width:74vw;
    height:74%;
    overflow:hidden;
    cursor:pointer;
  }
  .book-track{
    display:flex;
    height:100%;
    transition:transform 0.6s cubic-bezier(.65,0,.35,1);
  }
  .book-spread{
    flex:0 0 100%;
    display:flex;
    gap:0; /* FIX 8: niente più spazio tra le due pagine, si toccano come in un libro rilegato */
    height:100%;
    justify-content:center;
  }
  .book-page{
    flex:1 1 0;
    height:100%;
    overflow:hidden;
    background:#fff; /* riempie di bianco lo spazio che resta sotto le foto orizzontali */
    box-shadow:0 12px 30px rgba(0,0,0,0.10);
    display:flex;
    justify-content:center;
  }
  /* FIX 8: piccola ombra interna sul bordo dove le due pagine si toccano,
     per simulare la piega/rilegatura al centro del libro */
  .book-page:first-child{
    box-shadow:0 12px 30px rgba(0,0,0,0.10), inset -10px 0 14px -12px rgba(0,0,0,0.35);
  }
  .book-page:last-child{
    box-shadow:0 12px 30px rgba(0,0,0,0.10), inset 10px 0 14px -12px rgba(0,0,0,0.35);
  }
  .book-page img{
    width:100%;
    height:100%;
    object-fit:cover; /* FIX 8: default per le verticali — riempiono tutta la pagina, niente spazi bianchi */
    display:block;
  }
  /* FIX 8: solo le orizzontali (rilevate via JS) restano intere e allineate
     in alto, con lo spazio bianco sotto — le verticali usano "cover" sopra */
  .book-page img.is-landscape{
    object-fit:contain;
    object-position:top center;
  }
  .book-page.empty{ visibility:hidden; }
  .book-nav{
    display:flex;
    align-items:center;
    gap:1.6rem;
    font-size:0.85rem;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:var(--muted);
  }
  .book-nav button{
    background:none;
    border:none;
    cursor:pointer;
    font-family:inherit;
    font-size:1rem;
    color:var(--ink);
    padding:0.2rem 0.5rem;
  }
  .book-nav button:hover{ color:var(--muted); }
  .book-close{
    position:absolute;
    top:2.4rem; right:3vw;
    font-size:0.85rem;
    text-transform:uppercase;
    letter-spacing:0.04em;
  }
  .book-close:hover{ color:var(--muted); }

  @media(max-width:900px){
    html,body{ overflow:auto; }
    .page{ flex-direction:column; height:auto; }
    .left, .right{ width:100%; }
    .right{ height:80vh; margin-top:2rem; }
    .about-link, .email-link{ position:static; margin-top:2rem; display:block; }
  }
</style>
</head>
<body>

<div class="page">

  <div class="left">

    <div class="name-block">
      <a class="brand" href="index.html" data-view="home">Brigida Brancale</a>

      <nav class="main-nav">
        <a href="stories.html" data-view="stories">Stories</a>
        <a href="work.html" data-view="works">Works</a>
        <a href="publications.html" data-view="pubblication">Pubblication</a>
        <a href="collage.html" data-view="collage">Collage</a>
      </nav>
    </div>

    <div class="project-list" id="list-stories" hidden>
      <ul>
        <li><a href="stories.html#siwa" data-project="siwa">SIWA</a></li>
        <li><a href="stories.html#cellulari" data-project="cellulari">Cellulari</a></li>
        <li><a href="stories.html#abitare" data-project="abitare">Abitare</a></li>
        <li><a href="stories.html#here-be-dragons" data-project="here-be-dragons">Here Be Dragons</a></li>
      </ul>
    </div>

    <div class="project-list" id="list-works" hidden>
      <ul>
        <li><a href="work.html#canificio" data-project="canificio">Canificio</a></li>
        <li><a href="work.html#memoria-collettiva" data-project="memoria-collettiva">Memoria Collettiva</a></li>
        <li><a href="work.html#artiglieria" data-project="artiglieria">Artiglieria</a></li>
        <li><a href="work.html#nanako" data-project="nanako">Nanako</a></li>
        <li><a href="work.html#marcon" data-project="marcon">Marcon</a></li>
        <li><a href="work.html#nanako2" data-project="nanako2">Nanako2</a></li>
      </ul>
    </div>

    <a class="about-link" href="about.html">About</a>
  </div>

  <div class="right" id="right">
    <div class="frames-wrap" id="frames-wrap">
      <div class="frame" id="frame-home"></div>
    </div>

    <div class="photo-grid" id="grid-pubblication" hidden></div>
    <div class="photo-grid" id="grid-collage" hidden></div>

    <div class="book" id="book-viewer" hidden></div>
  </div>

  <a class="email-link" href="mailto:mail@brigidabrancale.com">mail@brigidabrancale.com</a>

</div>

<script>
  const homeImages = [
    "IMAGES/HBD01.jpg",
    "IMAGES/HBD02.jpg",
    "IMAGES/HBD03.jpg",
    "IMAGES/HBD04.jpg",
    "IMAGES/HBD05.jpg",
    "IMAGES/HBD06.jpg",
    "IMAGES/HBD07.jpg",
    "IMAGES/HBD08.jpg",
    "IMAGES/PHONES - 001.jpg",
    "IMAGES/PHONES - 002.jpg",
    "IMAGES/PHONES - 003.jpg",
    "IMAGES/PHONES - 004.jpg",
    "IMAGES/PHONES - 005.jpg",
    "IMAGES/PHONES - 006.jpg",
    "IMAGES/PHONES - 007.jpg",
    "IMAGES/PHONES - 008.jpg",
    "IMAGES/SIWA01.jpg",
    "IMAGES/SIWA02.jpg",

  const pubblicationImages = [
    "https://picsum.photos/id/1011/500/500",

  ];
  const collageImages = [
    "https://picsum.photos/id/1027/500/500",
    "https://picsum.photos/id/1031/500/500",
    "https://picsum.photos/id/1033/500/500",
    "https://picsum.photos/id/1044/500/500",
    "https://picsum.photos/id/1053/500/500",
    "https://picsum.photos/id/1057/500/500"
  ];

  const projectImages = {
    "siwa": [
      "IMAGES/SIWA01.jpg","IMAGES/SIWA02.jpg","IMAGES/SIWA03.jpg","IMAGES/SIWA04.jpg",
      "IMAGES/SIWA05.jpg","IMAGES/SIWA06.jpg","IMAGES/SIWA07.jpg","IMAGES/SIWA08.jpg",
      "IMAGES/SIWA09.jpg","IMAGES/SIWA10.jpg","IMAGES/SIWA11.jpg","IMAGES/SIWA12.jpg",
      "IMAGES/SIWA13.jpg","IMAGES/SIWA14.jpg","IMAGES/SIWA15.jpg","IMAGES/SIWA16.jpg",
      "IMAGES/SIWA17.jpg","IMAGES/SIWA18.jpg","IMAGES/SIWA19.jpg","IMAGES/SIWA20.jpg",
    ],
    "cellulari": [
      "IMAGES/PHONES - 001.jpg","IMAGES/PHONES - 002.jpg","IMAGES/PHONES - 003.jpg","IMAGES/PHONES - 004.jpg",
      "IMAGES/PHONES - 005.jpg","IMAGES/PHONES - 006.jpg","IMAGES/PHONES - 007.jpg","IMAGES/PHONES - 008.jpg",
      "IMAGES/PHONES - 009.jpg","IMAGES/PHONES - 0010.jpg","IMAGES/PHONES - 0011.jpg","IMAGES/PHONES - 0012.jpg",
      "IMAGES/PHONES - 0013.jpg","IMAGES/PHONES - 0014.jpg","IMAGES/PHONES - 0015.jpg","IMAGES/PHONES - 0016.jpg",
      "IMAGES/PHONES - 0017.jpg","IMAGES/PHONES - 0018.jpg","IMAGES/PHONES - 0019.jpg","IMAGES/PHONES - 0020.jpg",
      "IMAGES/PHONES - 0021.jpg","IMAGES/PHONES - 0022.jpg","IMAGES/PHONES - 0023.jpg","IMAGES/PHONES - 0024.jpg",
      "IMAGES/PHONES - 0025.jpg","IMAGES/PHONES - 0026.jpg",
    ],
    "abitare": [
      "https://picsum.photos/seed/abitare1/900/1200",
      "https://picsum.photos/seed/abitare2/900/1200"
    ],
    "here-be-dragons": [
      "IMAGES/HBD01.jpg","IMAGES/HBD02.jpg","IMAGES/HBD03.jpg","IMAGES/HBD04.jpg",
      "IMAGES/HBD05.jpg","IMAGES/HBD06.jpg","IMAGES/HBD07.jpg","IMAGES/HBD09.jpg",
      "IMAGES/HBD10.jpg","IMAGES/HBD11.jpg","IMAGES/HBD12.jpg","IMAGES/HBD13.jpg",
      "IMAGES/HBD14.jpg","IMAGES/HBD15.jpg","IMAGES/HBD16.jpg","IMAGES/HBD17.jpg",
      "IMAGES/HBD18.jpg","IMAGES/HBD19.jpg","IMAGES/HBD20.jpg","IMAGES/HBD21.jpg",
      "IMAGES/HBD22.jpg","IMAGES/HBD23.jpg","IMAGES/HBD24.jpg","IMAGES/HBD25.jpg",
      "IMAGES/HBD26.jpg","IMAGES/HBD27.jpg","IMAGES/HBD28.jpg",
    ],
    "canificio": [
      "https://picsum.photos/seed/canificio1/900/1200",

    ],
    "memoria-collettiva": [
      "https://picsum.photos/seed/memoria1/900/1200",
      "https://picsum.photos/seed/memoria2/900/1200"
    ],
    "artiglieria": [
      "https://picsum.photos/seed/artiglieria1/900/1200",
      "https://picsum.photos/seed/artiglieria2/900/1200"
    ],
    "nanako": [
      "https://picsum.photos/seed/nanako1/900/1200",
      "https://picsum.photos/seed/nanako2a/900/1200"
    ],
    "marcon": [
      "https://picsum.photos/seed/marcon1/900/1200",
      "https://picsum.photos/seed/marcon2/900/1200"
    ],
    "nanako2": [
      "https://picsum.photos/seed/nanako2b/900/1200",
      "https://picsum.photos/seed/nanako2c/900/1200"
    ]
  };

  function fillGrid(containerId, images){
    const container = document.getElementById(containerId);
    images.forEach(src => {
      const img = document.createElement('img');
      img.src = src;
      container.appendChild(img);
    });
  }
  fillGrid('grid-pubblication', pubblicationImages);
  fillGrid('grid-collage', collageImages);

  function slideshow(containerId, images, intervalMs = 2600){
    const container = document.getElementById(containerId);

    images.forEach((src, i) => {
      const img = document.createElement('img');
      img.src = src;
      if(i === 0) img.classList.add('active');
      container.appendChild(img);
    });

    const imgEls = container.querySelectorAll('img');
    let current = 0;

    if(imgEls.length < 2) return;

    setInterval(() => {
      imgEls[current].classList.remove('active');
      current = (current + 1) % imgEls.length;
      imgEls[current].classList.add('active');
    }, intervalMs);
  }

  slideshow('frame-home', homeImages);


  const rightColumn      = document.getElementById('right');
  const framesWrap       = document.getElementById('frames-wrap');
  const gridPubblication = document.getElementById('grid-pubblication');
  const gridCollage      = document.getElementById('grid-collage');
  const listStories      = document.getElementById('list-stories');
  const listWorks        = document.getElementById('list-works');
  const bookViewer       = document.getElementById('book-viewer');
  const mainNav          = document.querySelector('nav.main-nav');
  const navLinks         = document.querySelectorAll('[data-view]');
  const projectLinks     = document.querySelectorAll('[data-project]');

  let currentView = 'home';

  function showView(view){
    currentView = view;

    listStories.hidden = (view !== 'stories');
    listWorks.hidden   = (view !== 'works');

    const hideRight = (view === 'stories' || view === 'works');
    rightColumn.style.display = hideRight ? 'none' : 'block';
    framesWrap.style.display  = (view === 'home') ? 'block' : 'none';
    gridPubblication.hidden   = (view !== 'pubblication');
    gridCollage.hidden        = (view !== 'collage');

    mainNav.style.display = (view === 'home') ? 'flex' : 'none';

    bookViewer.hidden = true;
    projectLinks.forEach(a => a.classList.remove('active'));

    navLinks.forEach(a => a.classList.toggle('active', a.dataset.view === view));
  }

  navLinks.forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      showView(a.dataset.view);
    });
  });

  let bookImages = [];
  let spreadIndex = 0;

  function buildBook(key, linkEl){
    bookImages = projectImages[key] || [];
    spreadIndex = 0;
    bookViewer.innerHTML = '';

    if(bookImages.length === 0){
      const empty = document.createElement('p');
      empty.textContent = 'Nessuna foto trovata per questo progetto.';
      bookViewer.appendChild(empty);
      bookViewer.hidden = false;
      return;
    }

    const spreads = [];
    for(let i = 0; i < bookImages.length; i += 2){
      spreads.push([bookImages[i], bookImages[i + 1] || null]);
    }

    const closeBtn = document.createElement('a');
    closeBtn.href = '#';
    closeBtn.className = 'book-close';
    closeBtn.textContent = 'Chiudi ×';
    closeBtn.addEventListener('click', e => {
      e.preventDefault();
      closeBook();
    });

    const stage = document.createElement('div');
    stage.className = 'book-stage';

    const track = document.createElement('div');
    track.className = 'book-track';

    spreads.forEach(pair => {
      const spread = document.createElement('div');
      spread.className = 'book-spread';
      pair.forEach(src => {
        const page = document.createElement('div');
        page.className = 'book-page' + (src ? '' : ' empty');
        if(src){
          const img = document.createElement('img');
          // FIX 8: rileva se la foto è orizzontale o verticale non appena
          // è caricata, per decidere come mostrarla (vedi CSS .is-landscape)
          img.addEventListener('load', () => {
            if(img.naturalWidth > img.naturalHeight){
              img.classList.add('is-landscape');
            }
          });
          img.src = src;
          page.appendChild(img);
        }
        spread.appendChild(page);
      });
      track.appendChild(spread);
    });

    stage.appendChild(track);

    const nav = document.createElement('div');
    nav.className = 'book-nav';

    const prevBtn = document.createElement('button');
    prevBtn.type = 'button';
    prevBtn.textContent = '←';

    const counter = document.createElement('span');

    const nextBtn = document.createElement('button');
    nextBtn.type = 'button';
    nextBtn.textContent = '→';

    function render(){
      track.style.transform = `translateX(-${spreadIndex * 100}%)`;
      counter.textContent = (spreadIndex + 1) + ' / ' + spreads.length;
    }

    function goNext(){
      spreadIndex = (spreadIndex + 1) % spreads.length;
      render();
    }
    function goPrev(){
      spreadIndex = (spreadIndex - 1 + spreads.length) % spreads.length;
      render();
    }

    stage.addEventListener('click', goNext);
    prevBtn.addEventListener('click', e => { e.stopPropagation(); goPrev(); });
    nextBtn.addEventListener('click', e => { e.stopPropagation(); goNext(); });

    nav.appendChild(prevBtn);
    nav.appendChild(counter);
    nav.appendChild(nextBtn);

    bookViewer.appendChild(closeBtn);
    bookViewer.appendChild(stage);
    bookViewer.appendChild(nav);
    render();

    rightColumn.style.display = 'block';
    framesWrap.style.display = 'none';
    gridPubblication.hidden = true;
    gridCollage.hidden = true;
    bookViewer.hidden = false;

    projectLinks.forEach(a => a.classList.toggle('active', a === linkEl));
  }

  function closeBook(){
    bookViewer.hidden = true;
    projectLinks.forEach(a => a.classList.remove('active'));
    const hideRight = (currentView === 'stories' || currentView === 'works');
    rightColumn.style.display = hideRight ? 'none' : 'block';
    framesWrap.style.display = (currentView === 'home') ? 'block' : 'none';
    gridPubblication.hidden = (currentView !== 'pubblication');
    gridCollage.hidden = (currentView !== 'collage');
  }

  projectLinks.forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      buildBook(a.dataset.project, a);
    });
  });

  showView('home');
</script>

</body>
</html>

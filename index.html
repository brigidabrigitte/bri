<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brigida Brancale</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;1,300&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#F7F6F2;
    --ink:#14120F;
    --muted:#8D8A82;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  [hidden]{ display:none !important; }

  html,body{
    background:var(--bg);
    color:var(--ink);
    font-family:'DM Mono', monospace;
    font-weight:300;
    height:100%;
    overflow:hidden;
  }
  a{ color:inherit; text-decoration:none; }

  .page{
    display:flex;
    height:100vh;
    width:100vw;
  }

  .left{
    width:42%;
    position:relative;
    padding:2.4rem 3vw;
  }

  .right{
    width:58%;
    position:relative;
  }

  .frames-wrap{
    position:absolute;
    inset:0;
  }

  .photo-grid{
    position:absolute;
    inset:0;
    padding:2.4rem 3vw;
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    grid-auto-rows:1fr;
    gap:0.8rem;
    overflow-y:auto;
  }
  .photo-grid img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .brand{
    font-size:0.78rem;
    font-weight:300;
    letter-spacing:0.02em;
  }

  .name-block{
    display:flex;
    align-items:flex-start;
    gap:3.5vw;
  }

  nav.main-nav{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:0.55rem;
  }
  nav.main-nav a{
    font-size:0.78rem;
    text-transform:lowercase;
    letter-spacing:0.04em;
    position:relative;
  }
  nav.main-nav a::after{
    content:"";
    position:absolute; left:0; right:0; bottom:-2px;
    height:1px; background:currentColor;
    transform:scaleX(0); transform-origin:left;
    transition:transform .3s ease;
  }
  nav.main-nav a:hover::after{ transform:scaleX(1); }
  nav.main-nav a.active{ color:var(--muted); }

  .left{
    z-index:2; /* il menu e le sue liste restano sempre sopra le foto */
  }

  .project-list ul{
    list-style:none;
    display:flex;
    flex-direction:column;
    gap:0.6rem;
  }
  .project-list a{
    font-size:0.78rem;
    text-transform:lowercase;
    letter-spacing:0.04em;
    transition:opacity .25s ease;
  }
  .project-list a:hover{ opacity:0.55; }
  .project-list a.active{ opacity:0.55; }

  .about-link{
    position:absolute;
    left:3vw; bottom:2.4rem;
    font-size:0.78rem;
    text-transform:lowercase;
    letter-spacing:0.04em;
  }

  .project-description{
    position:absolute;
    left:3vw; right:6vw;
    bottom:5.2rem;
    font-size:0.78rem;
    line-height:1.55;
    color:var(--muted);
  }

  .email-link{
    position:absolute;
    right:3vw; bottom:2.4rem;
    font-size:0.78rem;
    color:var(--muted);
    z-index:10;
  }
  .email-link:hover{ color:var(--ink); }

  .home-collage{
    position:absolute;
    inset:0;
  }
  .collage-photo{
    position:absolute;
    width:auto;
    height:auto;
    opacity:0;
    transition:opacity 0.8s ease;
  }
  .collage-photo.visible{ opacity:1; }

  .book{
    position:absolute;
    inset:0;
    padding:2.4rem 3vw;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:1.2rem;
  }
  .book-stage{
    position:relative;
    width:100%;
    max-width:74vw;
    height:74%;
    overflow:hidden;
    cursor:pointer;
  }
  .book-track{
    display:flex;
    height:100%;
    transition:transform 0.6s cubic-bezier(.65,0,.35,1);
  }
  .book-slide{
    flex:0 0 100%;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100%;
  }
  .book-slide img{
    display:block;
    max-width:100%;
    max-height:100%;
    width:auto;
    height:auto;
  }
  .book-nav{
    display:flex;
    align-items:center;
    gap:1.6rem;
    font-size:0.78rem;
    text-transform:lowercase;
    letter-spacing:0.04em;
    color:var(--muted);
  }
  .book-nav button{
    background:none;
    border:none;
    cursor:pointer;
    font-family:inherit;
    font-size:0.78rem;
    color:var(--ink);
    padding:0.2rem 0.5rem;
  }
  .book-nav button:hover{ color:var(--muted); }
  .book-close{
    position:absolute;
    top:2.4rem; right:3vw;
    font-size:0.78rem;
    text-transform:lowercase;
    letter-spacing:0.04em;
  }
  .book-close:hover{ color:var(--muted); }

  @media(max-width:900px){
    html,body{ overflow:auto; }
    .page{ flex-direction:column; height:auto; }
    .left, .right{ width:100%; }
    .right{ height:80vh; margin-top:2rem; }
    .about-link, .email-link{ position:static; margin-top:2rem; display:block; }
  }
</style>
</head>
<body>

<div class="page">

  <div class="left">

    <div class="name-block">
      <a class="brand" href="index.html" data-view="home">Brigida Brancale</a>

      <nav class="main-nav">
        <a href="stories.html" data-view="stories">Stories</a>
        <a href="work.html" data-view="works">Works</a>
        <a href="publications.html" data-view="pubblication">Pubblication</a>
        <a href="collage.html" data-view="collage">Collage</a>

      <div class="project-list" id="list-stories" hidden>
        <ul>
          <li><a href="stories.html#siwa" data-project="siwa">SIWA</a></li>
          <li><a href="stories.html#cellulari" data-project="cellulari">Cellulari</a></li>

      </div>

      </div>
    </div>

    <div class="project-description" id="project-description" hidden></div>

    <a class="about-link" href="about.html">About</a>

  </div>

  <a class="email-link" href="mailto:mail@brigidabrancale.com">mail@brigidabrancale.com</a>

</div>

  function fillGrid(containerId, images){
    const container = document.getElementById(containerId);
    images.forEach(src => {
      const img = document.createElement('img');
      img.src = src;
      container.appendChild(img);
    });
  }
  fillGrid('grid-pubblication', pubblicationImages);
  fillGrid('grid-collage', collageImages);

  function shuffle(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function randomCollageSize(){
    const w = 140 + Math.random() * 200;
    const h = w * (1.1 + Math.random() * 0.5);
    return { w, h };
  }

  function findFreePosition(container, halfW, halfH, existing){
    const rect = container.getBoundingClientRect();
    const spanX = Math.max(rect.width - halfW * 2, 0);
    const spanY = Math.max(rect.height - halfH * 2, 0);
    for(let attempt = 0; attempt < 50; attempt++){
      const x = halfW + Math.random() * spanX;
      const y = halfH + Math.random() * spanY;
      const collision = existing.some(p =>
        Math.abs(x - p.x) < (halfW + p.halfW) && Math.abs(y - p.y) < (halfH + p.halfH)
      );
      if(!collision) return { x, y };
    }
    return null;
  }

  function startHomeCollage(containerId, images, maxVisible = 8){
    const container = document.getElementById(containerId);
    if(images.length === 0) return;

    let deck = shuffle(images);
    let deckIndex = 0;
    let shown = [];

    function nextImage(){
      if(deckIndex >= deck.length){
        deck = shuffle(images);
        deckIndex = 0;
      }
      return deck[deckIndex++];
    }

    function placeOne(){
      const size = randomCollageSize();
      const halfW = size.w / 2;
      const halfH = size.h / 2;
      const pos = findFreePosition(container, halfW, halfH, shown);
      if(!pos){
        scheduleNext();
        return;
      }

      const src = nextImage();
      const img = document.createElement('img');
      img.className = 'collage-photo';

      img.style.maxWidth = size.w + 'px';
      img.style.maxHeight = size.h + 'px';
      img.style.left = pos.x + 'px';
      img.style.top = pos.y + 'px';
      img.style.transform = 'translate(-50%, -50%)';
      img.src = src;

      container.appendChild(img);
      shown.push({ img, x: pos.x, y: pos.y, halfW, halfH });

      requestAnimationFrame(() => requestAnimationFrame(() => img.classList.add('visible')));

      if(shown.length >= maxVisible){
        setTimeout(resetCollage, 2200);
        return;
      }
      scheduleNext();
    }

    function resetCollage(){
      shown.forEach(item => item.img.classList.remove('visible'));
      setTimeout(() => {
        shown.forEach(item => item.img.remove());
        shown = [];
        scheduleNext();
      }, 800);
    }

    function scheduleNext(){
      const delay = 900 + Math.random() * 1400;
      setTimeout(placeOne, delay);
    }

    scheduleNext();
  }

  startHomeCollage('home-collage', homeImages);


  const framesWrap       = document.getElementById('frames-wrap');
  const gridPubblication = document.getElementById('grid-pubblication');
  const gridCollage      = document.getElementById('grid-collage');
  const listStories      = document.getElementById('list-stories');
  const listWorks        = document.getElementById('list-works');
  const bookViewer       = document.getElementById('book-viewer');
  const projectDescription = document.getElementById('project-description');
  const navLinks         = document.querySelectorAll('[data-view]');
  const projectLinks     = document.querySelectorAll('[data-project]');

  // >>> QUI VA IL TESTO VERO PER OGNI PROGETTO <<<
  const projectDescriptions = {
    "siwa": "Testo di presentazione del progetto SIWA — sostituisci con il tuo testo.",
    "cellulari": "Testo di presentazione del progetto Cellulari — sostituisci con il tuo testo.",
    "abitare": "Testo di presentazione del progetto Abitare — sostituisci con il tuo testo.",
    "here-be-dragons": "Testo di presentazione del progetto Here Be Dragons — sostituisci con il tuo testo.",
    "canificio": "Testo di presentazione del progetto Canificio — sostituisci con il tuo testo.",
    "memoria-collettiva": "Testo di presentazione del progetto Memoria Collettiva — sostituisci con il tuo testo.",
    "artiglieria": "Testo di presentazione del progetto Artiglieria — sostituisci con il tuo testo.",
    "nanako": "Testo di presentazione del progetto Nanako — sostituisci con il tuo testo.",
    "marcon": "Testo di presentazione del progetto Marcon — sostituisci con il tuo testo.",
    "nanako2": "Testo di presentazione del progetto Nanako2 — sostituisci con il tuo testo."
  };

  let currentView = 'home';

  // Mostra le cornici/griglia giuste per la sezione data, senza toccare
  // il libro di foto (usata sia da showView sia da closeBook, che prima
  // ripetevano le stesse tre righe).
  function applyRightPanel(view){
    framesWrap.style.display = (view === 'pubblication' || view === 'collage') ? 'none' : 'block';
    gridPubblication.hidden  = (view !== 'pubblication');
    gridCollage.hidden       = (view !== 'collage');
  }

  function showView(view){
    currentView = view;
    projectDescription.hidden = true;

    listStories.hidden = (view !== 'stories');
    listWorks.hidden   = (view !== 'works');

    applyRightPanel(view);

    bookViewer.hidden = true;
    projectLinks.forEach(a => a.classList.remove('active'));

    navLinks.forEach(a => a.classList.toggle('active', a.dataset.view === view));
  }

  navLinks.forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      showView(a.dataset.view);
    });
  });

  let bookImages = [];
  let slideIndex = 0;

  function buildBook(key, linkEl){
    bookImages = projectImages[key] || [];
    slideIndex = 0;
    bookViewer.innerHTML = '';

    if(bookImages.length === 0){
      const empty = document.createElement('p');
      empty.textContent = 'Nessuna foto trovata per questo progetto.';
      bookViewer.appendChild(empty);
      bookViewer.hidden = false;
      return;
    }

    const closeBtn = document.createElement('a');
    closeBtn.href = '#';
    closeBtn.className = 'book-close';
    closeBtn.textContent = 'Chiudi ×';
    closeBtn.addEventListener('click', e => {
      e.preventDefault();
      closeBook();
    });

    const stage = document.createElement('div');
    stage.className = 'book-stage';

    const track = document.createElement('div');
    track.className = 'book-track';

    // una slide per ogni foto
    bookImages.forEach(src => {
      const slide = document.createElement('div');
      slide.className = 'book-slide';
      const img = document.createElement('img');
      img.src = src;
      slide.appendChild(img);
      track.appendChild(slide);
    });

    stage.appendChild(track);

    const nav = document.createElement('div');
    nav.className = 'book-nav';

    const prevBtn = document.createElement('button');
    prevBtn.type = 'button';
    prevBtn.textContent = '←';

    const nextBtn = document.createElement('button');
    nextBtn.type = 'button';
    nextBtn.textContent = '→';

    // BUG RISOLTO: prima qui dentro c'era "counter.textContent = ..."
    // ma "counter" non era mai stato creato da nessuna parte — questo
    // mandava in errore tutta la funzione buildBook e faceva sì che il
    // libro non si aprisse mai. Il counter è stato tolto del tutto,
    // come richiesto, quindi render() ora si occupa solo di scorrere.
    function render(){
      track.style.transform = `translateX(-${slideIndex * 100}%)`;
    }

    function goNext(){
      slideIndex = (slideIndex + 1) % bookImages.length;
      render();
    }
    function goPrev(){
      slideIndex = (slideIndex - 1 + bookImages.length) % bookImages.length;
      render();
    }

    // clic sulla metà sinistra della foto = pagina precedente,
    // clic sulla metà destra = pagina successiva
    stage.addEventListener('click', e => {
      const rect = stage.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      if(clickX < rect.width / 2) goPrev();
      else goNext();
    });
    prevBtn.addEventListener('click', e => { e.stopPropagation(); goPrev(); });
    nextBtn.addEventListener('click', e => { e.stopPropagation(); goNext(); });

    nav.appendChild(prevBtn);
    nav.appendChild(nextBtn);

    bookViewer.appendChild(closeBtn);
    bookViewer.appendChild(stage);
    bookViewer.appendChild(nav);
    render();

    framesWrap.style.display = 'none';
    gridPubblication.hidden = true;
    gridCollage.hidden = true;
    bookViewer.hidden = false;

    projectDescription.textContent = projectDescriptions[key] || '';
    projectDescription.hidden = !projectDescriptions[key];

    projectLinks.forEach(a => a.classList.toggle('active', a === linkEl));
  }

  function closeBook(){
    bookViewer.hidden = true;
    projectDescription.hidden = true;
    projectLinks.forEach(a => a.classList.remove('active'));
    applyRightPanel(currentView);
  }

  projectLinks.forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      buildBook(a.dataset.project, a);
    });
  });

  showView('home');
</script>
